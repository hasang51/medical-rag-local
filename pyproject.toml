[project]
name = "medical-rag"
version = "0.1.0"
description = "Local-first medical RAG assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "rank-bm25>=0.2.2",
]

[project.scripts]
medical-rag = "medical_rag.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ollama: canlı yerel Ollama gerektiren testler",
]
addopts = ["-m", "not ollama"]
